replicaCount: 1

image:
  repository: ghcr.io/qihuipan/ci-preview-platform
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

config:
  leaseTTL: 30s
  workerTTL: 45s
  defaultTenantLimit: 2
  previewBaseDomain: preview.example.net

secret:
  existingSecret: ci-preview-platform
  webhookKey: github-webhook-secret

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
