# Build this image from the release source or set a registry image you control.
image: ci-preview-platform:0.2.0
imagePullPolicy: IfNotPresent
existingSecret: ci-secrets
storageClass: ""
api:
  replicas: 1
workers:
  - name: untrusted
    tokenKey: worker-token
    registrySecret: ""
controller:
  previewDomain: ""
  ingressClass: nginx
  # Optional existing wildcard TLS Secret in the controller namespace; copied to previews.
  tlsSecret: ""
  imagePullSecret: ""
github:
  appID: ""
  keySecret: ""
postgres:
  image: postgres:17.6-alpine
  storage: 10Gi
minio:
  image: ci-preview-minio:2025-10-15
  clientImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
  storage: 20Gi
  bucket: ci-artifacts
  retentionDays: 7
