apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: {app: {{ .Release.Name }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.postgres.storage }}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-postgres}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - {name: POSTGRES_DB, value: ci}
            - {name: POSTGRES_USER, value: ci}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: postgres-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, ci, -d, ci]}
            initialDelaySeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, ci, -d, ci]}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-postgres}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-minio}
spec:
  selector: {app: {{ .Release.Name }}-minio}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.minio.storage }}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-minio}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-minio}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-minio}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-access-key}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-secret-key}
          ports: [{containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-minio}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bucket-{{ .Release.Revision }}
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: initialize
          image: {{ .Values.minio.clientImage | quote }}
          command: [/bin/sh, -ec]
          args:
            - >-
              mc alias set local http://{{ .Release.Name }}-minio:9000 "$S3_USER" "$S3_PASSWORD";
              mc mb --ignore-existing local/{{ .Values.minio.bucket }};
              mc anonymous set none local/{{ .Values.minio.bucket }};
              mc ilm import local/{{ .Values.minio.bucket }} < /configuration/lifecycle.json
          volumeMounts: [{name: configuration, mountPath: /configuration, readOnly: true}]
          env:
            - name: S3_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-access-key}
            - name: S3_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-secret-key}
      volumes:
        - name: configuration
          configMap: {name: {{ .Release.Name }}-lifecycle}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}-lifecycle}
data:
  lifecycle.json: |
    {"Rules":[{"ID":"expire-artifacts","Status":"Enabled","Filter":{"Prefix":"attempts/"},"Expiration":{"Days":{{ .Values.minio.retentionDays }}}}]}
