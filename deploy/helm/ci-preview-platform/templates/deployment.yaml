apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ci-preview-platform.name" . }}
  labels:
    {{- include "ci-preview-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ci-preview-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "ci-preview-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ci-preview-platform.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: :8080
            - name: LEASE_TTL
              value: {{ .Values.config.leaseTTL | quote }}
            - name: WORKER_TTL
              value: {{ .Values.config.workerTTL | quote }}
            - name: DEFAULT_TENANT_LIMIT
              value: {{ .Values.config.defaultTenantLimit | quote }}
            - name: PREVIEW_BASE_DOMAIN
              value: {{ .Values.config.previewBaseDomain | quote }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.webhookKey }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
