apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-api}
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-api}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-api}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/api]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{containerPort: 8080}]
          env:
            - {name: AUTH_CONFIG_FILE, value: /secrets/auth.json}
            - {name: STATE_KEY_FILE, value: /secrets/state-key}
            - {name: DATABASE_URL_FILE, value: /secrets/database-url}
            - {name: S3_ENDPOINT, value: "http://{{ .Release.Name }}-minio:9000"}
            - {name: S3_BUCKET, value: {{ .Values.minio.bucket | quote }}}
            - {name: S3_ACCESS_KEY_FILE, value: /secrets/s3-access-key}
            - {name: S3_SECRET_KEY_FILE, value: /secrets/s3-secret-key}
            - {name: GITHUB_WEBHOOK_SECRET_FILE, value: /secrets/webhook-secret}
            {{- if .Values.github.keySecret }}
            - {name: GITHUB_APP_ID, value: {{ .Values.github.appID | quote }}}
            - {name: GITHUB_APP_KEY_FILE, value: /github/private-key.pem}
            {{- end }}
          startupProbe:
            httpGet: {path: /readyz, port: 8080}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: secrets, mountPath: /secrets, readOnly: true}
            {{- if .Values.github.keySecret }}
            - {name: github, mountPath: /github, readOnly: true}
            {{- end }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              {{- range list "auth.json" "state-key" "database-url" "s3-access-key" "s3-secret-key" "webhook-secret" }}
              - {key: {{ . }}, path: {{ . }}}
              {{- end }}
        {{- if .Values.github.keySecret }}
        - name: github
          secret: {secretName: {{ .Values.github.keySecret }}, defaultMode: 0440}
        {{- end }}
{{- range .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $.Release.Name }}-worker-{{ .name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $.Release.Name }}-worker-{{ .name }}}
  template:
    metadata:
      labels: {app: {{ $.Release.Name }}-worker-{{ .name }}}
    spec:
      serviceAccountName: {{ $.Release.Name }}-worker
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: {{ $.Values.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: [/service]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: API_URL, value: "http://{{ $.Release.Name }}-api:8080"}
            - {name: API_TOKEN_FILE, value: /credentials/token}
            - {name: WORKER_IMAGE, value: {{ $.Values.image | quote }}}
            - {name: HOME, value: /tmp}
            {{- if .registrySecret }}
            - {name: REGISTRY_CONFIG_FILE, value: /registry/config.json}
            {{- end }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .registrySecret }}
            - {name: registry, mountPath: /registry, readOnly: true}
            {{- end }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ $.Values.existingSecret }}
            defaultMode: 0440
            items: [{key: {{ .tokenKey }}, path: token}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- if .registrySecret }}
        - name: registry
          secret:
            secretName: {{ .registrySecret }}
            defaultMode: 0440
            items: [{key: .dockerconfigjson, path: config.json}]
        {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-controller}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-controller}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-controller}
    spec:
      serviceAccountName: {{ .Release.Name }}-controller
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/controller]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: API_URL, value: "http://{{ .Release.Name }}-api:8080"}
            - {name: API_TOKEN_FILE, value: /credentials/token}
            - {name: PREVIEW_DOMAIN, value: {{ .Values.controller.previewDomain | quote }}}
            - {name: INGRESS_CLASS, value: {{ .Values.controller.ingressClass | quote }}}
            - {name: PREVIEW_TLS_SECRET, value: {{ .Values.controller.tlsSecret | quote }}}
            - {name: PREVIEW_PULL_SECRET, value: {{ .Values.controller.imagePullSecret | quote }}}
            - {name: PLATFORM_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credentials
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items: [{key: controller-token, path: token}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
