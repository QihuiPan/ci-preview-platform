name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Run static analysis
        run: go vet ./...

      - name: Run race-enabled tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build commands
        run: go build ./cmd/...

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build control-plane container
        run: docker build --build-arg COMMAND=api --tag ci-preview-platform:test .
