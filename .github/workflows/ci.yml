name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:integration-only@localhost:5432/ci_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Require a changelog entry for the change commit
        shell: bash
        run: |
          if test "$(git log -1 --format=%P | wc -w)" -lt 2; then
            git diff-tree --no-commit-id --name-only -r --root HEAD | grep -qx CHANGELOG.md
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Run static analysis
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Run race-enabled tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build commands
        run: go build ./cmd/...

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build control-plane container
        run: docker build --tag ci-preview-platform:test .
