# Development dependencies only. Actual job execution requires Kubernetes.
# These credentials are intentionally local-only and must not be used in production.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: ci-preview-minio:2025-10-15
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["127.0.0.1:9000:9000"]
    volumes: [minio-data:/data]
volumes:
  postgres-data:
  minio-data:
